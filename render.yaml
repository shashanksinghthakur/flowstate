services:
  - type: web
    name: flowstate
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AUTH_PROVIDERS
        value: google,apple,twitter
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_CHANNEL_URL
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
